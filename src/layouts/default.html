<!DOCTYPE html>
<html
  lang="en"
  x-data="layout()"
  :class="{
  'dark': $store.app.isDark,
  '': !$store.app.isDark
}"
>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apollo - Tailwind CSS Banking Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="/postcss/main.postcss" />
  </head>
  <body class="w-full h-full bg-white dark:bg-muted-900">
    <!-- prettier-ignore -->

    <!--Site sidebar-->
    {{> navigation/sidebar/sidebar}}

    <!--Site panel-->
    {{> navigation/panel/panel}}

    <main
      x-cloak
      class="relative w-full overflow-hidden transition-all duration-300 z-10"
      :class="$store.app.isLayoutCompact ? 'ml-0 lg:w-[calc(100%_-_80px)] lg:ml-[80px]' : 'ml-0 lg:w-[calc(100%_-_250px)] lg:ml-[250px]'"
    >
      <!--Container-->
      <div
        class="
          w-full
          max-w-5xl
          min-h-screen
          mx-auto
          px-4
          md:px-6
          bg-white
          dark:bg-muted-900
        "
      >
        <!--Site navbar-->
        {{> navigation/navbar/navbar}}

        <!-- Renders the page body -->
        {{> @partial-block }}
      </div>
    </main>

    <!--Back to top button-->
    {{> misc/backtotop}}

    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>
