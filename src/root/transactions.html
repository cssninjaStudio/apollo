<!--Start Layout-->
{{#> default }}

<!--Wrapper-->
<div class="w-full pb-24">
  <!--Header-->
  <div class="flex items-center justify-between py-6">
    <h2 class="font-heading text-3xl text-muted-800 dark:text-white">
      Transactions
    </h2>
    <div class="flex items-center gap-2">
      <span class="font-sans text-muted-700 dark:text-muted-400">0-0 of 0</span>
      <div class="flex gap-2">
        <button
          type="button"
          class="
            h-8
            w-5
            flex
            items-center
            justify-center
            text-muted-700
            dark:text-muted-400
          "
        >
          <i class="iconify w-4 h-4" data-icon="lucide:chevron-left"></i>
        </button>
        <button
          type="button"
          class="
            h-8
            w-5
            flex
            items-center
            justify-center
            text-muted-700
            dark:text-muted-400
          "
        >
          <i class="iconify w-4 h-4" data-icon="lucide:chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!--Table-->
  <div class="w-full">
    <!--Filters-->
    <div class="w-full flex items-center gap-5">
      <!--Dropdown-->
      {{> filter/transactions/transactions-dropdown-filters}}

      <span
        class="
          hidden
          md:block
          font-sans
          text-sm
          font-medium
          text-muted-600
          dark:text-muted-500
        "
      >
        No filters applied
      </span>

      <button
        type="button"
        class="
          group
          ml-auto
          font-sans font-medium
          text-sm
          inline-flex
          items-center
          justify-center
          gap-2
          h-9
          px-6
          rounded-full
          bg-muted-100
          hover:bg-muted-200
          dark:bg-muted-800 dark:hover:bg-muted-700
          text-muted-500
          hover:text-muted-600
          dark:hover:text-muted-300
          transition-all
          duration-300
          tw-accessibility
        "
      >
        <i
          class="iconify w-3 h-3 group-hover:text-primary-500"
          data-icon="lucide:download"
        ></i>
        <span>Export All</span>
      </button>
    </div>

    <!--Table-->
    {{> page/transactions/transactions-table}}

    <!--Footer-->
    <div class="flex items-center justify-end py-6">
      <div class="flex items-center gap-2">
        <span class="font-sans text-muted-700 dark:text-muted-400">
          0-0 of 0
        </span>
        <div class="flex gap-2">
          <button
            type="button"
            class="
              h-8
              w-5
              flex
              items-center
              justify-center
              text-muted-700
              dark:text-muted-400
            "
          >
            <i class="iconify w-4 h-4" data-icon="lucide:chevron-left"></i>
          </button>
          <button
            type="button"
            class="
              h-8
              w-5
              flex
              items-center
              justify-center
              text-muted-700
              dark:text-muted-400
            "
          >
            <i class="iconify w-4 h-4" data-icon="lucide:chevron-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!--End Layout-->
{{/default}}
