<!--Start Layout-->
{{#> default }}

<!--Wrapper-->
<div x-data="cards()" class="w-full pb-24">
  <!--Header-->
  <div class="flex items-center justify-between py-6">
    <h2 class="font-heading text-3xl text-muted-800 dark:text-white">Cards</h2>
  </div>

  <!--Table-->
  <div class="w-full">
    <!--Filters-->
    <div class="w-full flex items-center gap-5">
      <!--Dropdown-->
      {{> filter/cards/cards-dropdown-filters}}

      <span
        class="hidden md:block font-sans text-sm font-medium text-muted-600 dark:text-muted-500"
      >
        No filters applied
      </span>

      <a
        href="/cards-create.html"
        class="group ml-auto font-sans font-medium text-sm inline-flex items-center justify-center gap-2 h-9 px-6 rounded-full bg-muted-100 hover:bg-muted-200 dark:bg-muted-800 dark:hover:bg-muted-700 text-muted-500 hover:text-muted-600 dark:hover:text-muted-300 transition-all duration-300 tw-accessibility"
      >
        <iconify-icon
          class="iconify w-3 h-3 group-hover:text-primary-500"
          icon="lucide:plus"
        ></iconify-icon>
        <span>New Card</span>
      </a>
    </div>

    <!--Table-->
    {{> page/cards/cards-list}}
  </div>
</div>

<!--Card details panel-->
{{> page/cards/cards-panel}}

<!--End Layout-->
{{/default}}
