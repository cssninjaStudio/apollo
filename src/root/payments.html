<!--Start Layout-->
{{#> default }}

<!--Wrapper-->
<div x-data="payments()" class="w-full pb-24">
  <!--Header-->
  <div class="flex items-center justify-between py-6">
    <h2 class="font-heading text-3xl text-muted-800 dark:text-white">
      Payments
    </h2>
    <!--Buttons-->
    <div class="hidden md:flex items-center gap-2">
      <button
        type="button"
        class="group font-sans font-medium text-sm inline-flex items-center justify-center gap-2 h-9 px-6 rounded-full bg-muted-100 hover:bg-muted-200 dark:bg-muted-800 dark:hover:bg-muted-700 text-muted-500 hover:text-muted-600 dark:hover:text-muted-300 transition-all duration-300 tw-accessibility"
      >
        <iconify-icon
          class="iconify w-3 h-3 group-hover:text-primary-500"
          icon="lucide:send"
        ></iconify-icon>
        <span>New Payment</span>
      </button>
      <button
        type="button"
        class="group font-sans font-medium text-sm inline-flex items-center justify-center gap-2 h-9 px-6 rounded-full bg-muted-100 hover:bg-muted-200 dark:bg-muted-800 dark:hover:bg-muted-700 text-muted-500 hover:text-muted-600 dark:hover:text-muted-300 transition-all duration-300 tw-accessibility"
      >
        <iconify-icon
          class="iconify w-3 h-3 group-hover:text-primary-500"
          icon="lucide:mail"
        ></iconify-icon>
        <span>Request Payment</span>
      </button>
    </div>
  </div>

  <!--Tabs wrapper-->
  <div>
    <!--Tabs-->
    <div class="flex items-center justify-between overflow-hidden">
      <div
        class="flex gap-x-6 grow font-sans border-b border-muted-200 dark:border-muted-800 xs:overflow-x-auto"
      >
        <a
          data-tab="tab-1"
          @click="toggle($event)"
          class="pb-2 select-none border-b-2 cursor-pointer transition-colors duration-300"
          :class="
            activeTab === 'tab-1'
              ? 'text-muted-700 dark:text-muted-100 border-primary-500'
              : 'text-muted-300 hover:text-muted-400 dark:text-muted-500 dark:hover:text-muted-400 border-transparent'
          "
        >
          Outgoing
        </a>
        <a
          data-tab="tab-2"
          @click="toggle($event)"
          class="pb-2 select-none border-b-2 cursor-pointer transition-colors duration-300"
          :class="
            activeTab === 'tab-2'
              ? 'text-muted-700 dark:text-muted-100 border-primary-500'
              : 'text-muted-300 hover:text-muted-400 dark:text-muted-500 dark:hover:text-muted-400 border-transparent'
          "
        >
          Incoming
        </a>
        <a
          data-tab="tab-3"
          @click="toggle($event)"
          class="pb-2 select-none border-b-2 cursor-pointer transition-colors duration-300"
          :class="
            activeTab === 'tab-3'
              ? 'text-muted-700 dark:text-muted-100 border-primary-500'
              : 'text-muted-300 hover:text-muted-400 dark:text-muted-500 dark:hover:text-muted-400 border-transparent'
          "
        >
          Recipients
        </a>
      </div>
    </div>

    <!--Tab content-->
    <div class="w-full py-6">
      <!--Outgoing tab-->
      <div x-show="activeTab === 'tab-1'" class="w-full">
        <div class="space-y-10">
          <!--Needs approval-->
          <div class="w-full">
            <h3
              class="font-heading text-xl text-muted-800 dark:text-muted-200 mb-5"
            >
              Needs approval
            </h3>

            <!--Placeholder-->
            {{> page/payments/payments-placeholder}}
          </div>
          <!--Scheduled-->
          <div class="w-full">
            <h3
              class="font-heading text-xl text-muted-800 dark:text-muted-200 mb-5"
            >
              Scheduled
            </h3>

            <!--Scheduled payments list-->
            {{> page/payments/payments-scheduled}}
          </div>
        </div>
      </div>
      <!--Incoming tab-->
      <div x-show="activeTab === 'tab-2'" class="w-full">
        <div class="space-y-10">
          <!--Payment requests-->
          <div class="w-full">
            <h3
              class="font-heading text-xl text-muted-800 dark:text-muted-200 mb-5"
            >
              Payment requests
            </h3>

            <!--Payments loader-->
            <template x-if="isLoading">
              {{> page/payments/payments-incoming-placeload}}
            </template>

            <!--Payments list-->
            <template x-if="!isLoading">
              {{> page/payments/payments-incoming}}
            </template>
          </div>
        </div>
      </div>

      <!--Recepients tab-->
      <div x-show="activeTab === 'tab-3'" class="w-full">
        <div class="space-y-10">
          <!--Recepients-->
          <div class="w-full">
            <h3
              class="font-heading text-xl text-muted-800 dark:text-muted-200 mb-5"
            >
              Recipients
            </h3>

            {{> page/payments/payments-recipients}}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!--End Layout-->
{{/default}}
