<div
  x-show="currentStep === 2"
  class="w-full flex flex-col md:flex-row items-center"
>
  <!--Column-->
  <div class="w-full md:w-1/2">
    <div class="max-w-md space-y-3 p-4">
      <h2
        class="font-heading font-bold text-3xl text-muted-800 dark:text-white"
      >
        Legal downloads.
      </h2>
      <p class="font-sans text-muted-500 dark:text-muted-400">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut optime,
        secundum naturam affectum esse possit.
      </p>
      <!--Download links-->
      <div class="py-5">
        <ul class="space-y-1">
          <!--Link-->
          <li>
            <a
              href="#"
              class="
                flex
                gap-4
                px-4
                py-3
                rounded-lg
                hover:bg-muted-100
                dark:hover:bg-muted-800
                transition-colors
                duration-300
              "
            >
              <i
                class="iconify w-7 h-7 text-primary-500"
                data-icon="ph:bank-duotone"
              ></i>
              <div>
                <p
                  class="
                    font-heading font-medium
                    mb-1
                    text-sm text-muted-600
                    dark:text-muted-300
                  "
                >
                  Terms Of Service
                </p>
                <p class="font-heading text-xs text-muted-400 mb-1">
                  Read this document carefully
                </p>
              </div>
            </a>
          </li>
          <!--Link-->
          <li>
            <a
              href="#"
              class="
                flex
                gap-4
                px-4
                py-3
                rounded-lg
                hover:bg-muted-100
                dark:hover:bg-muted-800
                transition-colors
                duration-300
              "
            >
              <i
                class="iconify w-7 h-7 text-primary-500"
                data-icon="ph:coins-duotone"
              ></i>
              <div>
                <p
                  class="
                    font-heading font-medium
                    mb-1
                    text-sm text-muted-600
                    dark:text-muted-300
                  "
                >
                  Credit Contract
                </p>
                <p class="font-heading text-xs text-muted-400 mb-1">
                  Credit contract document sample
                </p>
              </div>
            </a>
          </li>
        </ul>
      </div>

      <!--Buttons-->
      <div class="flex gap-2">
        <button
          class="
            h-10
            w-32
            inline-flex
            justify-center
            items-center
            gap-x-2
            px-6
            py-2
            font-sans
            text-sm text-primary-500
            bg-transparent
            hover:bg-muted-100
            dark:hover:bg-muted-800
            rounded-full
            tw-accessibility
            transition-all
            duration-300
          "
          @click="prevStep()"
        >
          <span>Previous</span>
        </button>
        <button
          class="
            h-10
            w-32
            inline-flex
            justify-center
            items-center
            gap-x-2
            px-6
            py-2
            font-sans
            text-sm text-white
            bg-primary-500
            rounded-full
            shadow-lg shadow-primary-500/20
            hover:shadow-xl
            tw-accessibility
            transition-all
            duration-300
          "
          @click="nextStep()"
        >
          <span>Finish</span>
        </button>
      </div>
    </div>
  </div>
  <!--Column-->
  <div class="w-full md:w-1/2">
    <div class="max-w-sm mx-auto text-primary-500">
      {{> vector/illustrations/wallet-credit-card}}
    </div>
  </div>
</div>
