<!--Step 3-->
<div x-show="currentStep === 2" class="w-full">
  <!--Review section-->
  <div x-show="!isComplete">
    <h2
      class="
        font-heading
        text-2xl
        md:text-3xl
        text-muted-800
        dark:text-white
        mb-10
      "
    >
      Review and send
    </h2>

    <div class="w-full max-w-md space-y-6">
      <!--Numbers-->
      <div class="flex items-end justify-between pb-4">
        <!--Amount-->
        <div class="flex-1">
          <p class="font-heading text-xs text-muted-400 mb-1">
            Transfer amount
          </p>
          <h3
            class="
              font-heading font-medium
              text-3xl text-muted-800
              dark:text-muted-100
            "
          >
            $
            <span x-text="formatAmount()"></span>
          </h3>
        </div>
        <!--Amount-->
        <div class="flex-1 text-right">
          <p class="font-heading text-xs text-muted-400 mb-1">Payment method</p>
          <h3
            class="
              font-heading font-medium
              text-sm text-muted-800
              dark:text-muted-100
            "
          >
            <span x-text="paymentMethod"></span>
          </h3>
        </div>
      </div>

      <!--Transfer from-->
      <template x-if="paymentMethod === 'transfer'">
        <div>
          <p class="font-heading text-xs text-muted-400 mb-1">Transfer from</p>
          <div
            class="
              w-full
              p-4
              bg-white
              dark:bg-muted-1000
              rounded-xl
              border border-muted-200
              dark:border-muted-800
            "
          >
            <div class="w-full flex items-center gap-3 text-left">
              <iconify-icon class="iconify w-8 h-8 flex items-center justify-center text-2xl text-muted-500 dark:text-muted-400" icon="clarity:bank-outline-badged"></iconify-icon>
              <div>
                <span
                  class="
                    block
                    font-heading
                    text-sm text-muted-800
                    dark:text-muted-200
                  "
                >
                  External bank account
                </span>
                <span
                  class="
                    block
                    font-heading
                    text-xs text-muted-500
                    dark:text-muted-400
                  "
                >
                  $25,267.42
                </span>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!--Send to-->
      <template x-if="paymentMethod === 'link'">
        <div>
          <p class="font-heading text-xs text-muted-400 mb-1">Send to</p>

          <div class="relative">
            <div class="group relative">
              <input
                type="text"
                x-model="email"
                readonly
                class="
                  p-4
                  pl-12
                  py-2
                  h-12
                  text-base
                  leading-5
                  font-sans
                  w-full
                  rounded-md
                  bg-white
                  text-muted-600
                  border border-muted-300
                  focus:border-muted-300
                  focus:shadow-lg
                  focus:shadow-gray-300/50
                  dark:focus:shadow-gray-800/50
                  placeholder:text-muted-300
                  dark:placeholder:text-muted-700
                  dark:bg-muted-1000
                  dark:text-muted-200
                  dark:border-muted-800
                  dark:focus:border-muted-800
                  tw-accessibility
                  transition-all
                  duration-300
                  pointer-events-none
                "
                placeholder="Your recipient's email address"
              />
              <div
                class="
                  absolute
                  top-0
                  left-0
                  h-12
                  w-12
                  flex
                  justify-center
                  items-center
                  text-muted-400
                  dark:text-muted-600
                  group-focus-within:text-primary-500
                  transition-colors
                  duration-300
                  cursor-pointer
                "
              >
                <iconify-icon class="iconify w-5 h-5" icon="lucide:mail"></iconify-icon>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!--Amount-->
      <div>
        <p class="font-heading text-xs text-muted-400 mb-1">Transfer to</p>
        <div
          class="
            w-full
            p-4
            bg-white
            dark:bg-muted-1000
            rounded-xl
            border border-muted-200
            dark:border-muted-800
          "
        >
          <div class="w-full flex items-center gap-3 text-left">
            <img
              src="/img/logo/logo-square-outline.svg"
              class="w-8 h-8 dark:invert"
              alt="App logo"
              width="48"
              height="48"
            />
            <div>
              <span
                class="
                  block
                  font-heading
                  text-sm text-muted-800
                  dark:text-muted-200
                "
              >
                checking xxx4869
              </span>
              <span
                class="
                  block
                  font-heading
                  text-xs text-muted-500
                  dark:text-muted-400
                "
              >
                $9,384.21
              </span>
            </div>
          </div>
        </div>
      </div>

      <!--Buttons-->
      <div class="flex gap-4">
        <button
          type="button"
          class="
            w-full
            h-12
            inline-flex
            justify-center
            items-center
            rounded-md
            px-4
            py-2
            font-heading
            text-sm text-muted-600
            hover:text-muted-700
            dark:text-muted-400 dark:hover:text-muted-100
            bg-muted-100
            hover:bg-muted-200
            dark:bg-muted-800 dark:hover:bg-muted-700
            transition-colors
            duration-300
          "
          @click="prevStep()"
        >
          Previous
        </button>
        <button
          type="button"
          class="
            w-full
            h-12
            inline-flex
            justify-center
            items-center
            rounded-md
            px-4
            py-2
            font-heading
            text-white text-sm
            bg-primary-500
          "
          :class="isLoading ? 'button-loading' : ''"
          @click="sendRequest()"
        >
          Send Request
        </button>
      </div>
    </div>
  </div>

  <!--Success section-->
  <div x-show="isComplete">
    {{> page/payments-receive/receive-step-success}}
  </div>
</div>
